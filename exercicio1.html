<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Registro de usuario</title>
</head>
<body>
    <header style="background-color: black;">
        <h1 style="text-align: center; color: white;">Registro de usuarios</h1>
        <hr>
    </header>
    <main>
        <!--Formlário de cadastro-->
            <form action="#" method="get">
                <!--Nome do luno-->
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
                <br><br>

                <!--Sobrenome do luno-->
                <label for="nomeS">Sobrenome:</label>
                <input type="text" id="nomeS" name="nomeS" required>
                <br><br>

                <!--Campo data de nascimento-->
                <label for="dataN">Data de Nascimento</label>
                <input type="date" id="dataN" name="dataN" required>
                <br><br>

                <!--Campo de Escolha-->
                <label>Qual seu sexo?</label>
                <br>
                <label for="H">Homem</label>
                <input type="radio" id="H" name="pergunta">
                <br>
                <label for="M">Mulher</label>
                <input type="radio" value="M" name="pergunta">
                <br><br>

                <!-- Email do Aluno-->
                 <label for="">Email:</label>
                 <input type="email" id="email" name="email" required>
                <br><br>

                <!--Campo de telefone-->
                <label for="Telefone">Telefone do aluno</label>
                <input type="tel" id="Telefone" name="Telefone" required>
                <br><br>

                <label for="end">Endereço:</label>
                <input type="text" id="end" name="end" required>
                <br><br>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>
                <br><br>

                <label for="opcao">Selecione a seu Estado</label>
                <!--Campo de seleção-->
                <select name="opcao" id="opcao">
                <!-- Criando opções para selecionar -->
                 <option value="" selected disabled>Selecione...</option>
                 <option value="Sala Vermelha">SP</option>
                 <option value="Sala Azul">RJ</option>
                 <option value="Sala Verde">Outro lugar</option>
                 </select>
                <br><br>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" required>
                <br><hr>

                <label for="nu">Nome de usuario:</label>
                <input type="text" id="nu" name="nu" required>
                <br><br>

                <label for="senaha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
                <br><br>
                
                <label for="Csenaha">Confirme sua Senha:</label>
                <input type="password" id="Csenha" name="Csenha" required>
                <br><br>

                <!--Campo de arquivo-->
                <label for="file">Foto de perfil:</label>
                <input type="file" id="file" name="file">
                <br><br>

                <!--Campo de range-->
                <label for="progresso">O Quanto você gosta das aulas do SENAI</label>
                <!--Input do tipo de range cria uma barra de progresso-->
                <input type="range" id="progresso" name="progresso">
                <br><br>

                <!--Input de cor-->
                <label for="color">Escolha sua cor favorita</label>
                <input type="color" id="color" name="color">
                <br><br>

                <!--Campo de arquivo-->
                <label for="file">Envie sua foto</label>
                <input type="file" id="file" name="file">
                <br><br>

                <!--Campo com textarena-->
                <label for="obs">Observações</label>
                <textarea name="obs" id="obs" rows="1"></textarea>
                <br><br>

                <!--Campo de checkbox-->
                <input type="checkbox" id="termos" name="termos" value="termos">
                <label for="termos">Li e concordo com os termos</label>
                <br>
                <input type="checkbox" id="receberEmail" name="receberEmail" value="receberEmail">
                <label for="receberEmail">Desejo receber E-Mail de divulgação</label>
                <br>
                <input type="checkbox" id="receberSMS" name="receberSMS" value="receberSMS">
                <label for="receberSMS">Desejo receber SMS</label>
                <br><br>

                <!--Botão de enviar-->
                <button type="submit">Enviar</button>
            </form>
    </main>
</body>
</html>

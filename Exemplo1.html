<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Formulário - Exemplo 1</title>
    </head>
    <body>
        <header>
            <h1 style="text-align: center;">Formulário de cadastro</h1>
        </header>

        <!-- Cnteúdo principal-->
         <main>
            <!--Criação de Formulário-->

            <!--Action com # mantem o formulário na mesma pagina -->
            <!-- Method GET faz o envio pela URL do site-->
            <form action="#" method="get">
                <!-- Primeiro campo -->
                 <label for="nome">Nome</label>
                 <input type="text" id="nome" name="nome" placeholder="Digite seu nome...">
                 <br><br>
                 <!--Segundo campo-->
                 <label for="idade">Idade</label>
                 <input type="nunmber" id="idade" name="idade" placeholder="Fale sua idade">
                 <br><br>
                 <!--Botão para enviar-->
                 <button type="submit">Enviar</button>
            </form>
    </body>
</html>

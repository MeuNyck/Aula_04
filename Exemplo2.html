<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Exemplo 2 - Formulários</title>
    </head>
    <body>
        <header style="text-align: center;">
            <h1>Cadastro de Alunos</h1>
            <hr>
        </header>

        <main>
            <!--Formlário de cadastro-->
            <form action="#" method="get">
                <!--Nome do luno-->
                <label for="nome">Nome do Aluno:</label>
                <input type="text" id="nome" name="nome" required>
                <br><br>

                <!-- Email do Aluno-->
                 <label for="">Email do aluno</label>
                 <input type="email" id="email" name="email" required>
                <br><br>

                <!--Campo de telefone-->
                <label for="Telefone">Telefone do aluno</label>
                <input type="tel" id="Telefone" name="Telefone" required>
                <br><br>

                <!--Campo data de nascimento-->
                <label for="dataN">Data de Nascimento</label>
                <input type="date" id="dataN" name="dataN" required>
                <br><br>

                <!--Idade do Aluno-->
                <label for="idade">Idade do Aluno</label>
                <input type="number" id="idade" name="idade" required>
                <br><br>

                <!--Campo de Escolha-->
                <label>você estuda para as provas?</label>
                <br>
                <label for="sim">Sim, estudo</label>
                <input type="radio" id="sim" name="pergunta">
                <br>
                <label for="nao">Não estudo</label>
                <input type="radio" value="nao" name="pergunta">
                <br><br>

                <!--Campo de range-->
                <label for="progresso">O Quanto você gosta das aulas do SENAI</label>
                <!--Input do tipo de range cria uma barra de progresso-->
                <input type="range" id="progresso" name="progresso">
                <br><br>

                <!--Input de cor-->
                <label for="color">Escolha sua cor favorita</label>
                <input type="color" id="color" name="color">
                <br><br>

                <label for="opcao">Selecione a sua sala</label>
                <!--Campo de seleção-->
                <select name="opcao" id="opcao">
                <!-- Criando opções para selecionar -->
                 <option value="" selected disabled>Selecione...</option>
                 <option value="Sala Vermelha">Sala Vermelha</option>
                 <option value="Sala Azul">Sala Azul</option>
                 <option value="Sala Verde">Sala Verde</option>
                 </select>
                <br><br>

                <!--Campo de arquivo-->
                <label for="file">Envie sua foto</label>
                <input type="file" id="file" name="file">
                <br><br>

                <!--Campo com textarena-->
                <label for="obs">Observações</label>
                <textarea name="obs" id="obs" rows="1"></textarea>
                <br><br>

                <!--Campo de checkbox-->
                <input type="checkbox" id="termos" name="termos" value="termos">
                <label for="termos">Li e concordo com os termos</label>
                <br>
                <input type="checkbox" id="receberEmail" name="receberEmail" value="receberEmail">
                <label for="receberEmail">Desejo receber E-Mail de divulgação</label>
                <br>
                <input type="checkbox" id="receberSMS" name="receberSMS" value="receberSMS">
                <label for="receberSMS">Desejo receber SMS</label>
                <br><br>

                <!--Botão de enviar-->
                <button type="submit">Enviar</button>
            </form>
        </main>
    </body>
</html>
